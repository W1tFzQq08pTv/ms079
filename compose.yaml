services:
  ms079-server:
    build:
      context: .
      target: runtime
    image: ms079-server:local
    container_name: ms079-server
    network_mode: "container:ms079-mysql"
    restart: unless-stopped
    volumes:
      - ./wz:/app/wz:ro
      - ./脚本:/app/脚本:ro
      - ./服务端配置.ini:/app/服务端配置.ini:ro
      - ./logs:/app/logs
