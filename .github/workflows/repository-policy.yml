name: Repository Policy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Secret / repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check repository diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/check-repository-diff.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Scan pull request commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          --workdir /repo
          "$GITLEAKS_IMAGE"
          git --redact --no-banner
          --log-opts="$BASE_SHA..$HEAD_SHA"
          /repo
