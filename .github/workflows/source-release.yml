name: Source Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish source archives
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and commit
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use vX.Y.Z syntax (pre-release/build suffixes are supported)." >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tagged commit must already be contained in origin/main." >&2
            exit 1
          fi

      - name: Build source archives
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          archive_root="ms079-${TAG_NAME}"
          mkdir -p dist

          git archive \
            --format=tar \
            --prefix="${archive_root}/" \
            "${GITHUB_SHA}" \
            | gzip -9 > "dist/${archive_root}-source.tar.gz"

          git archive \
            --format=zip \
            --prefix="${archive_root}/" \
            --output="dist/${archive_root}-source.zip" \
            "${GITHUB_SHA}"

          (
            cd dist
            sha256sum \
              "${archive_root}-source.tar.gz" \
              "${archive_root}-source.zip" \
              > SHA256SUMS
          )

          tar --gzip --list --file "dist/${archive_root}-source.tar.gz" >/dev/null
          unzip -tq "dist/${archive_root}-source.zip"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          archive_root="ms079-${TAG_NAME}"
          assets=(
            "dist/${archive_root}-source.tar.gz"
            "dist/${archive_root}-source.zip"
            "dist/SHA256SUMS"
          )

          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            exit 0
          fi

          release_options=()
          if [[ "${TAG_NAME}" == *-* ]]; then
            release_options+=(--prerelease)
          fi

          gh release create "${TAG_NAME}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${TAG_NAME}" \
            "${release_options[@]}"
